[project]
name = "wonky-twin"
version = "0.1.0"
description = "Kinematic SKR Pico digital twin; not a clearance certificate"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.12,<4",
    "numpy==2.4.2",
    "pyserial==3.5",
]

[project.scripts]
wonky-twin = "wonky_twin.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
