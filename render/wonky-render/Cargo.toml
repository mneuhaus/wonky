[package]
name = "wonky-render"
version = "0.1.0"
edition = "2021"
license = "MIT"
[workspace]
[dependencies]
wgpu = { version = "=24.0.5", default-features = false, features = ["wgsl", "metal"] }
bytemuck = { version = "=1.24.0", features = ["derive"] }
glam = "=0.29.3"
png = "=0.17.16"
pollster = "=0.4.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
wonky-geom = { path = "../../rust/wonky-geom" }
wonky-ops = { path = "../../rust/wonky-ops" }
num-traits = "=0.2.19"
winit = "=0.30.12"
[profile.release]
opt-level = 3
[features]
# Acceptance mutation only; never built into production renderer.
plant-fixed-distance = []
